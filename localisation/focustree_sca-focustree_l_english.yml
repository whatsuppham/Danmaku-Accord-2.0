l_english: 
SCA_permit_ability_card_galas:0 "Permit Ability Card Galas"
SCA_permit_ability_card_galas_desc:0 "The rise of the fad of "Ability Cards" in markets around Gensokyo reaps potential for profit and traction. Under the guise of vague Galas and events, we can involve ourselves in the process without gathering too much of the Hakurei's attention."
SCA_regulate_the_markets:0 "Regulate the Markets"
SCA_regulate_the_markets_desc:0 "The surge of Ability Cards will be destabilizing if allowed to flow through the state. We must begin to restrict its flow and allow more surveillance in the markets."
SCA_scarlethakurei_collaboration:0 "Scarlet-Hakurei Collaboration"
SCA_scarlethakurei_collaboration_desc:0 "We can inform and cooperate with the peacekeepers of Gensokyo in the regulation of the recent surge of new concepts and trade."
SCA_preparation_for_the_incident:0 "Preparation for the Incident"
SCA_preparation_for_the_incident_desc:0 "Regardless of our stance, it is expected by our advisors that the abrupt change in trade most likely will transform into an incident. We must prepare and decide how to react."
SCA_the_maid_sector:0 "The Maid Sector"
SCA_the_maid_sector_desc:0 "Within the Scarlet Manor and its nation, the maids have rapidly expanded their duties and performance. It is about time we promote them to give official recognition."
SCA_chief_izayoi:0 "Chief Izayoi"
SCA_chief_izayoi_desc:0 "We believe promotion of individuals over the collective fosters faster and more effective results. If this concept is applied to the maid sector, we may see even better results in their performance."
SCA_representative_maid_reform:0 "Representative Maid Reform"
SCA_representative_maid_reform_desc:0 "A focus on the improvement of collective results and opinion will foster efficiency and more accurate reforms in flaws of the current maid systems."
SCA_conduct_investigations:0 "Conduct Investigations"
SCA_conduct_investigations_desc:0 "It is the belief of the current administration that reforms are most likely underway for the governance of the Scarlet Dominion. There are various sectors that can be improved."
SCA_rd:0 "R&D"
SCA_rd_desc:0 "Gensokyo may be on the foothold of advance, regardless of regulation from Hakurei. Either subversive or allowed, we must continue to outperform the competition."
SCA_the_magistrate_and_patchouli:0 "The Magistrate and Patchouli"
SCA_the_magistrate_and_patchouli_desc:0 "Keeping Magicians and Library-esque methods of research allows us a distinct image on the Gensokyan stage."
SCA_unbiased_laboratories:0 "Unbiased Laboratories"
SCA_unbiased_laboratories_desc:0 "Instead of having key figures and prominence, we will prioritize collective agreement and safety over bolder breakthroughs."
SCA_the_question_of_the_draft:0 "The Question of the Draft"
SCA_the_question_of_the_draft_desc:0 "This focus unlocks decisions that affect are vital for mobilization and military in preparation for an incident"
SCA_close_the_borders:0 "Close the Borders"
SCA_close_the_borders_desc:0 "It is our belief that if we take the initiative in restricting entry into our state during this period of uncertainty, that we may avoid the majority of conflict, if it is to come.\n\nGiven the size of our nation, this will no doubt cause tension."
SCA_opportunist_refuge:0 "Opportunist Refuge"
SCA_opportunist_refuge_desc:0 "If we gain the trust of the keen and provide security, we will surely benefit from the new card trades."
SCA_the_scarlet_ghetto:0 "The Scarlet Ghetto"
SCA_the_scarlet_ghetto_desc:0 "An intelligence service should be established to monitor incursion and incidents on Scarlet soil. Enough incidents have proved that a lack of awareness and certainty lead to chaos."
SCA_support_the_marketeering:0 "Support the Marketeering"
SCA_support_the_marketeering_desc:0 "By boldly involving ourselves in the marketeering movement, we will most likely antagonize peacekeepers, but it will ensure that most of the trade traffic focuses on us."
SCA_incident_response:0 "Incident Response"
SCA_incident_response_desc:0 "We must contribute to the international efforts to contain the spread of the new trading system."
SCA_market_surveillance:0 "Market Surveillance"
SCA_market_surveillance_desc:0 "We must seed agents inside the development of trade in the Marketeering incident to gather information to make better judgements."
SCA_control_the_scarlet_market_chaos:0 "Control the Scarlet Market Chaos"
SCA_control_the_scarlet_market_chaos_desc:0 "We must reign in the extreme methods used against competing unions and stores to obtain the new Ability Cards to solve worsening logistical concerns.."
SCA_vflight_mechanization:0 "V-Flight Mechanization"
SCA_vflight_mechanization_desc:0 "Vampires learning to fuse with technology will dominate the future of Gensokyan military power."
SCA_laevateinnrocketry:0 "Lævateinn Rocketry"
SCA_laevateinnrocketry_desc:0 "Rocketry"
SCA_devilsairborneprogram:0 "Devil's Airborne Program"
SCA_devilsairborneprogram_desc:0 "Devil"
SCA_scarlet_industrialization_initiative:0 "Scarlet Industrialization Initiative"
SCA_scarlet_industrialization_initiative_desc:0 "SII"
SCA_dusk_underground:0 "D.U.S.K. Underground"
SCA_dusk_underground_desc:0 "We may, in our pursuit of safety and contingency plans, develop a network of sustainability for our nation through the various castles, forts, and rough terrain in our borders."
