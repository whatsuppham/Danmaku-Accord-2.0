l_english:
 EIE_eternal_palace:0 "The Eternal Palace"
 EIE_eternal_palace_desc:0 "Eientei has survived by remaining quiet, hidden, and deliberate. The age of open incidents demands that the mansion become more than a refuge; it must become a government."
 EIE_hourai_court:0 "The Hourai Court"
 EIE_hourai_court_desc:0 "Kaguya's authority is ancient, but authority still needs hands, messengers, clerks, and loyal intermediaries. A formal court will give Eientei's rule a visible shape."
 EIE_lunar_administration:0 "Lunar Administration"
 EIE_lunar_administration_desc:0 "The methods of the Moon are exacting and cold, but useful. By adapting them to Gensokyo, Eientei can turn secrecy into efficient governance."
 EIE_rabbit_bureau:0 "The Rabbit Bureau"
 EIE_rabbit_bureau_desc:0 "The rabbits know every hidden path in the Bamboo Forest. If properly organized, their networks can become the nervous system of the nation."
 EIE_hidden_clinics:0 "Hidden Clinics"
 EIE_hidden_clinics_desc:0 "Eientei's medical knowledge is one of its greatest assets. Expanding discreet clinics will improve public trust while keeping our most sensitive methods protected."
 EIE_impossible_medicine:0 "Impossible Medicine"
 EIE_impossible_medicine_desc:0 "The boundary between miracle and science is thinner inside Eientei than anywhere else. A focused research program may produce treatments no outside power can imitate."
 EIE_bamboo_workshops:0 "Bamboo Workshops"
 EIE_bamboo_workshops_desc:0 "The forest hides more than paths and rumors. With careful planning, its secluded clearings can host workshops beyond the reach of prying eyes."
 EIE_moonlit_roads:0 "Moonlit Roads"
 EIE_moonlit_roads_desc:0 "To defend the forest, we must first move through it. New roads and supply paths will let Eientei act quickly without exposing the heart of the mansion."
 EIE_munitions_under_the_floorboards:0 "Munitions Under the Floorboards"
 EIE_munitions_under_the_floorboards_desc:0 "A peaceful clinic is no use if it cannot defend its patients. Discreet arms production will ensure Eientei is not caught unprepared."
 EIE_rabbit_watch:0 "The Rabbit Watch"
 EIE_rabbit_watch_desc:0 "Scouts, couriers, and lookouts can become soldiers without losing the talents that make them valuable. The Rabbit Watch will defend Eientei on its own terms."
 EIE_forest_defense_plan:0 "Forest Defense Plan"
 EIE_forest_defense_plan_desc:0 "An enemy that enters the Bamboo Forest should feel lost long before they reach Eientei. Prepared strongpoints and misleading approaches will turn the terrain into a shield."
 EIE_danmaku_drills:0 "Danmaku Drills"
 EIE_danmaku_drills_desc:0 "Discipline does not diminish danmaku; it gives each pattern purpose. Regular drills will help our forces fight as an organized whole."
 EIE_moon_rabbit_signal_corps:0 "Moon Rabbit Signal Corps"
 EIE_moon_rabbit_signal_corps_desc:0 "The quickest soldier is wasted if orders arrive too late. A dedicated signal corps will bind our patrols, commanders, and clinics together."
 EIE_night_sky_patrols:0 "Night Sky Patrols"
 EIE_night_sky_patrols_desc:0 "The skies above the forest are watched by more than the moon. Patrol flights will give Eientei warning before trouble reaches the trees."
 EIE_lunar_engineering:0 "Lunar Engineering"
 EIE_lunar_engineering_desc:0 "Eientei still carries fragments of lunar technical knowledge. Applied carefully, those fragments can modernize our aircraft and support equipment."
 EIE_bamboo_collective_security:0 "Bamboo Collective Security"
 EIE_bamboo_collective_security_desc:0 "Eientei cannot secure the forest alone. The rabbit states, medical unions, and splinter communities must be drawn into a framework that keeps the peace."
 EIE_settle_the_labor_question:0 "Settle the Labor Question"
 EIE_settle_the_labor_question_desc:0 "The labor movement cannot simply be ordered back into silence. Addressing its grievances will keep the Bamboo Forest from turning against itself."
 EIE_support_the_medical_union:0 "Support the Medical Union"
 EIE_support_the_medical_union_desc:0 "The medical union shares Eientei's deepest practical interest: survival through care. Support for its institutions will strengthen the whole forest."
 EIE_secure_the_bamboo_forest:0 "Secure the Bamboo Forest"
 EIE_secure_the_bamboo_forest_desc:0 "The forest must be a refuge for our people and a warning to our enemies. Coordinated patrols and shared command will make that promise credible."
 EIE_a_future_without_exile:0 "A Future Without Exile"
 EIE_a_future_without_exile_desc:0 "Eientei was born from flight and concealment. If we succeed, it can become something rarer: a home that no longer expects to be abandoned."
