l_english: 
YKM_operation_market_control:0 "Operation Market Control"
YKM_operation_market_control_desc:0 "Youkai Mountain's potential for economic domination in Gensokyo is limited by less-than-optimal bureaucracy and regulation. Surely, with the Great Tengu Megumu on our side, if we work in the shadows, it will work out.\n\nMost likely, we will have a decent amount of time before the regulatory forces catch on and try to stop our profits."
YKM_siphoning_the_gensokyan_market:0 "Siphoning the Gensokyan Market"
YKM_siphoning_the_gensokyan_market_desc:0 "It is time we begin to realize our gains and activate our agents around Gensokyo. For how long the incident may last, we must ensure we take the most home before the authorities halt our operations."
YKM_invitation_of_tenkyuu:0 "Invitation of Tenkyuu"
YKM_invitation_of_tenkyuu_desc:0 "Chimata Tenkyuu, the Goddess of Marketplaces and Commerce, has massive potential for power in the realm of trade. Using her love for the craft, we can push our own agenda and profit heavily."
YKM_delay_hakurei_peacekeeping:0 "Delay Hakurei Peacekeeping"
YKM_delay_hakurei_peacekeeping_desc:0 "It is well known that subversive and armed forces from Hakurei interfere with any Youkai or other force than its own. They must be delayed and prevented access to our markets and intel as long as possible."
YKM_full_media_dominance:0 "Full Media Dominance"
YKM_full_media_dominance_desc:0 "Our nation is vast and filled with journalists who strive to report for various reasons. Our government must make sure that information that leaves and enters the borders will not cause issues!"
YKM_highwind_information_authority:0 "Highwind Information Authority"
YKM_highwind_information_authority_desc:0 "We must make sure that our own citizens don't misunderstand or slow down our progress in achieving international dominance, and therefore, we must establish observance over our own."
YKM_talon_arms_initiative:0 "T.A.L.O.N Arms Initiative"
YKM_talon_arms_initiative_desc:0 "We must make sure we are ready for an incursion from Hakurei and its allies. Without a physical defense against them, our business will not sustain."
YKM_discreet_fortification:0 "Discreet Fortification"
YKM_discreet_fortification_desc:0 "In the depths of our forests, we can ensure skirmishes are brutal to push... for our potential adversaries."
YKM_paramilitary_exercise:0 "Paramilitary Exercise"
YKM_paramilitary_exercise_desc:0 "Armed forces that supposedly train and operate outside of government reach is subject to less scrutiny. With discreet funding, we can keep these groups hidden until conflict breaks out."
YKM_the_hakurei_diversion:0 "The Hakurei Diversion"
YKM_the_hakurei_diversion_desc:0 "With our operations still functional, we can deal a final blow to the Hakurei that keeps them from winning the public over.\n\nWe must fabricate their involvement in Youkai prejudice and immorality."
YKM_a_mixed_victory:0 "A Mixed Victory"
YKM_a_mixed_victory_desc:0 "We have struggled against the Hakurei and have failed to overcome their tradition of regulation and suppression of Youkai influence Gensokyo-wide. It leaves us the main perpetrator and stains us for the foreseeable future, but we have gotten our worth."
YKM_take_profits_and_crash_the_market:0 "Take Profits and Crash the Market"
YKM_take_profits_and_crash_the_market_desc:0 "We can stop our profits and advance now and halt the aggression we face against peacekeepers and walk away with what we have now, instead of risking it on continued conflict with Hakurei."
YKM_the_prolonged_youkaimiko_conflict:0 "The Prolonged Youkai-Miko Conflict"
YKM_the_prolonged_youkaimiko_conflict_desc:0 "We have not achieved success in any timely manner, and are now subject to one of the longest incident crises in Gensokyan history."
