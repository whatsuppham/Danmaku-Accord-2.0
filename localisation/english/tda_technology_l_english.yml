l_english:
 pre_industrialization_folder:0 "Pre-Industrial Era / Magic"
 PRE_INDUSTRIALIZATION_TITLE_WEAPONS:0 "PHYSICAL WEAPONRY"
 PRE_INDUSTRIALIZATION_TITLE_MAGIC:0 "OFUDA & WARDEN MAGIC"

 tda_spear_weaponry:0 "Spear Weaponry"
 tda_spear_weaponry_desc:0 "Simple polearms remain cheap, reliable, and easy to distribute to village levies and shrine guards. They are not elegant, but they give a line of infantry reach and discipline."
 tda_swordsmithing:0 "Swordsmithing"
 tda_swordsmithing_desc:0 "Better blades allow troops to move beyond spear walls and into faster close-quarter fighting. A trained swordsman is harder to mass, but far more flexible."
 tda_refined_blades:0 "Refined Blades"
 tda_refined_blades_desc:0 "Improved forging, balanced hilts, and standardized sword patterns make blade infantry more reliable in prolonged fighting."

 tda_shield_formations:0 "Shield Formations"
 tda_shield_formations_desc:0 "A shield is more than a slab of wood or metal. In formation, shields allow poorly equipped infantry to hold ground against arrows, charges, and stray danmaku."
 tda_reinforced_shields:0 "Reinforced Shields"
 tda_reinforced_shields_desc:0 "Layered frames and metal bracing let shield troops survive heavier blows without losing the mobility expected of front-line infantry."
 tda_tower_shields:0 "Tower Shields"
 tda_tower_shields_desc:0 "Large defensive shields slow their bearers, but they can anchor a line against missile fire, primitive guns, and magical scattershot."

 tda_gunpowder_research:0 "Gunpowder Research"
 tda_gunpowder_research_desc:0 "Powder stores, ignition safety, and basic explosive mixtures form the foundation for any firearm program."
 tda_matchlock_weaponry:0 "Matchlock Weaponry"
 tda_matchlock_weaponry_desc:0 "Early firearms are slow and temperamental, but their shock value cannot be ignored. Proper matchlock production gives infantry a new way to break enemy lines."
 tda_musket_volley_fire:0 "Musket Volley Fire"
 tda_musket_volley_fire_desc:0 "The musket becomes far more dangerous when fired by ranks rather than individuals. Volley discipline turns noise and smoke into a battlefield system."
 tda_flintlock_weaponry:0 "Flintlock Weaponry"
 tda_flintlock_weaponry_desc:0 "Flintlock mechanisms simplify firing and reduce dependence on exposed matchcords, making firearm troops more reliable in bad weather and confused fighting."

 ofuda_cards:0 "Basic Magic Spellcards"
 ofuda_cards_desc:0 "The Ofuda Card is the standard tool to enable suppressive but non-lethal weaponry. It is used to reinforce the Danmaku Spellcard System and Laws."
 tda_ofuda_discipline:0 "Ofuda Discipline"
 tda_ofuda_discipline_desc:0 "Ofuda cards are most effective when their users follow shared spellcard patterns, restraint codes, and recovery procedures after battle."
 tda_magical_shields:0 "Magical Shields"
 tda_magical_shields_desc:0 "Layered wards can be condensed into shield charms, allowing trained corps to protect allies from physical attacks and low-grade danmaku."
 tda_primitive_magic_bombs:0 "Primitive Magic Bombs"
 tda_primitive_magic_bombs_desc:0 "Crude magical charges are dangerous to store and difficult to aim, but they give warden forces an explosive answer to entrenched enemies."

 tda_spear_equipment:0 "Spear Equipment"
 tda_spear_equipment_desc:0 "Polearms, spearheads, shafts, field repair kits, and the basic tools required by spear infantry."
 tda_spear_equipment_0:0 "Basic Spears"
 tda_spear_equipment_0_desc:0 "Cheap and sturdy spear sets suitable for levies, guards, and early field formations."
 tda_sword_equipment:0 "Sword Equipment"
 tda_sword_equipment_desc:0 "Blades, scabbards, grips, and field-maintenance gear for close-combat infantry."
 tda_sword_equipment_0:0 "Forged Swords"
 tda_sword_equipment_0_desc:0 "Standardized swords suitable for trained close-combat troops."
 tda_sword_equipment_1:0 "Refined Swords"
 tda_sword_equipment_1_desc:0 "Improved blades with better balance, durability, and battlefield handling."

 tda_shield_equipment:0 "Shield Equipment"
 tda_shield_equipment_desc:0 "Shields, braces, bucklers, and reinforced protective gear for defensive infantry formations."
 tda_shield_equipment_0:0 "Basic Shields"
 tda_shield_equipment_0_desc:0 "Simple shields that improve the staying power of infantry expected to hold ground under pressure."
 tda_shield_equipment_1:0 "Reinforced Shields"
 tda_shield_equipment_1_desc:0 "Braced and layered shields for more disciplined defensive formations."
 tda_shield_equipment_2:0 "Tower Shields"
 tda_shield_equipment_2_desc:0 "Large shields intended to hold lines against heavy missile fire and direct assaults."

 tda_musket_equipment:0 "Musket Equipment"
 tda_musket_equipment_desc:0 "Early firearms, shot, powder, cleaning tools, and the fittings needed to keep black-powder troops in the field."
 tda_musket_equipment_0:0 "Matchlock Muskets"
 tda_musket_equipment_0_desc:0 "Unreliable but powerful early firearms that give infantry a major advantage over purely melee formations."
 tda_musket_equipment_1:0 "Volley Muskets"
 tda_musket_equipment_1_desc:0 "Improved muskets and firing procedures suited for organized volley fire."
 tda_musket_equipment_2:0 "Flintlock Muskets"
 tda_musket_equipment_2_desc:0 "More reliable firearms with simplified ignition mechanisms."

 ofuda_cards_0:0 "Ofuda and Warden Weaponry"
 ofuda_cards_0_desc:0 "This equipment serves to suppress and subdue combatants in the most non-lethal way possible using magic."
 tda_magic_shield_equipment:0 "Magic Shield Equipment"
 tda_magic_shield_equipment_desc:0 "Ward charms, shield talismans, and focus tools used to project defensive magic."
 tda_magic_shield_equipment_0:0 "Basic Magic Shields"
 tda_magic_shield_equipment_0_desc:0 "Simple protective wards prepared for battlefield use."
 tda_magic_bomb_equipment:0 "Magic Bomb Equipment"
 tda_magic_bomb_equipment_desc:0 "Crude magical charges, seals, and containers used by primitive bombardment troops."
 tda_magic_bomb_equipment_0:0 "Primitive Magic Bombs"
 tda_magic_bomb_equipment_0_desc:0 "Unstable but destructive magical charges."

 spear_infantry:0 "Spear Infantry"
 spear_infantry_desc:0 "Cheap front-line infantry equipped with polearms. They are useful for early armies and emergency levies."
 sword_infantry:0 "Sword Infantry"
 sword_infantry_desc:0 "Close-combat infantry equipped with swords. They are more flexible than spear troops, but require better equipment and training."
 shield_infantry:0 "Shield Infantry"
 shield_infantry_desc:0 "Defensive infantry trained to hold ground with shields and simple close-combat weapons."
 musket_infantry:0 "Musket Infantry"
 musket_infantry_desc:0 "Early firearm infantry. They hit harder than spear troops, but require more training and supply."
 peacekeeping_corps:0 "Spellcard Corps"
 peacekeeping_corps_desc:0 "This unit is designed for non-lethal warfare to settle various disputes."
 ward_shield_corps:0 "Ward Shield Corps"
 ward_shield_corps_desc:0 "Specialized spellcard troops trained to project defensive wards across the front line."
 magic_bombardment_corps:0 "Magic Bombardment Corps"
 magic_bombardment_corps_desc:0 "Warden troops equipped with crude magical charges for breaking hardened positions."
 vampire_corps:0 "Vampire Corps"
 vampire_corps_desc:0 "A fast moving vampire corps."
