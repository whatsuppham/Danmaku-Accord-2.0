l_english: 
HAK_request_international_aid:0 "Request International Aid"
HAK_request_international_aid_desc:0 "We must rally the minds of the various races of Gensokyo that share our ambitions of stability in which our nation has not enough to fight the incident alone."
HAK_nothing_happened_at_the_shrine:0 "Nothing Happened at the Shrine"
HAK_nothing_happened_at_the_shrine_desc:0 "We must ensure that no word escapes of the passing of the head Priestess. Should the information be disclosed to the public, the minds that keep the very fabric of our existence possible will unravel with unpredictable outcomes."
HAK_the_point_of_no_return:0 "The Point of No Return"
HAK_the_point_of_no_return_desc:0 "Despite the greatest of efforts, political violence has surged past reason. In the midst of the chaos, assailants stormed Reimu Hakurei's home and executed her in the midst of her spa relaxation.\n\nNo deaths have occurred in any incidents prior until now, let alone a prominent figure. The darkest era of Gensokyo has opened up."
HAK_state_of_ideological_emergency:0 "State of Ideological Emergency"
HAK_state_of_ideological_emergency_desc:0 "The worst has been realized through our misjudgment. Fueled by our lack of interference and the accusation of scandal,  Gensokyo is now at the mercy of an influx of market reform that stirs political violence from an otherwise neutral world.\n\nWe must enact last measures to contain the threat."
HAK_the_council_divides:0 "The Council Divides"
HAK_the_council_divides_desc:0 "The Council that runs the efforts and activities of Hakurei peacekeeping has fallen into an unproductive state of arguments over intervention versus avoidance. It does not help that the market phenomenon gains traction.\n\nThis undermines our reputation and effectiveness!"
HAK_order_over_oblivion:0 "Order Over Oblivion"
HAK_order_over_oblivion_desc:0 "After centuries of stability, the fragility of the ecosystem of Gensokyo has reminded us that our peace is not without struggle. We must rise to the occasion and ensure that the politics and nature of our people stay the way it has always been."
HAK_retain_the_spell_card_rules:0 "Retain the Spell Card Rules"
HAK_retain_the_spell_card_rules_desc:0 "Despite the descent into record violence, we must hold on to the Danmaku system that keeps the majority of stability and laws that prevent murder with all our might, for the abyss is in our peripherals."
HAK_the_martyr_clause:0 "The Martyr Clause"
HAK_the_martyr_clause_desc:0 "We must make public the realities we face of a rapidly declining situation. If we disclose the death of the Chief Priestess, we may see a chain reaction of an international hesitance to continue violence. A gamble, but with not many options now, we do not have any other choice."
HAK_the_day_peace_died:0 "The Day Peace Died"
HAK_the_day_peace_died_desc:0 "Despite the greatest of efforts, the turmoil Gensokyo faces is at an all-time high, and the Hakurei family has fled for their safety. Effectively, the council has crumbled and peacekeeping is not a viable option anymore. May the gods help us now."
HAK_theministrysclosure:0 "The Ministry's Closure"
HAK_theministrysclosure_desc:0 "Due to the enormous pressure from within and the public, it seems that the best option is to conduct operations outside of an official perspective. The government buildings must be shutdown."
HAK_the_gensomiko_protocol:0 "The Genso-Miko Protocol"
HAK_the_gensomiko_protocol_desc:0 "The worst is now here to stay, unless we take all matters into our own hands.\n\nThe full mobilization of our peacekeeping forces and government control of all nations for the time being will ensure we can contain the crisis to the best of our abilities."
HAK_acknowledge_the_disruption:0 "Acknowledge the Disruption"
HAK_acknowledge_the_disruption_desc:0 "There is no doubt that an incident is either here or on the loom. We must seek to officialize and mitigate.\n\nThe stability of Gensokyo rests on our performance."
HAK_discredit_the_rumors:0 "Discredit the Rumors"
HAK_discredit_the_rumors_desc:0 "Despite the surge in market reform, this is no incident. This is merely a fad. It will come to pass as we know it, and if it doesn't? We believe the fearmongering does more damage."
HAK_officialize_the_incident:0 "Officialize the Incident"
HAK_officialize_the_incident_desc:0 "We have enough evidence to confirm this is a threat to Gensokyo and is at the hands of entities within. We must stabilize this, and making it official will make it easier."
HAK_deploy_the_peacekeepers:0 "Deploy the Peacekeepers"
HAK_deploy_the_peacekeepers_desc:0 "The threat that faces us now grows off the greed of the entire community of Gensokyo. We must mobilize our armed forces to restore order swiftly."
HAK_utilize_the_torii_agency:0 "Utilize the Torii Agency"
HAK_utilize_the_torii_agency_desc:0 "We must return to subversive activity and reactivate the dormant spy networks to gain insight into the deeper markets of the incident.\n\nShould this information be leaked to the public, it would have negative implications."
HAK_antiinterventionism:0 "Anti-Interventionism"
HAK_antiinterventionism_desc:0 "Peacekeeping is not necessary during this reform. Despite the initial reaction to change, it may prove beneficial for the efficiency of Gensokyo."
HAK_arrest_the_market_movement:0 "Arrest the Market Movement"
HAK_arrest_the_market_movement_desc:0 "We must begin to restrict access and traffic regarding this incident in order to prevent replication. It starts with those who know how to trade ability cards and are willing to do so."
HAK_annual_speech_of_gensokyo:0 "Annual Speech of Gensokyo"
HAK_annual_speech_of_gensokyo_desc:0 "The State of Hakurei will address the entirety of Gensokyo to declare her stances and wishes for the priorities of all communities. The speech has long been an annual tradition that has guided the diverse territory.\n\nThis speech is affected by the degree of interference with the emerging Marketeering phenomenon."
HAK_the_framing_of_hakurei:0 "The Framing of Hakurei"
HAK_the_framing_of_hakurei_desc:0 "The leader of Hakurei and beacon of stability, Reimu Hakurei, has been pulled into the rumors of misconduct against the Youkai Mountain. Despite the suspicion, she does not back down as the head of Gensokyan peacekeeping."
HAK_close_the_marketeers_incident:0 "Close the Marketeers Incident"
HAK_close_the_marketeers_incident_desc:0 "Our efforts have proved successful. We have eliminated the threat and abuse of present systems and stability in Gensokyo and yet against preserve its fragile state."
HAK_reitaisai_festival:0 "Reitaisai Festival"
HAK_reitaisai_festival_desc:0 "Despite a rough entry into the season, Gensokyo has lived yet another year since the last festival."
HAK_boundary_renewal_initiative:0 "Boundary Renewal Initiative"
HAK_boundary_renewal_initiative_desc:0 "It is within the duties of the Hakurei to maintain the barrier that keeps the world of Gensokyo intact. This season, an increase in efforts may help us repair it less frequently."
HAK_cost_review_act:0 "Cost Review Act"
HAK_cost_review_act_desc:0 "In a collective agreement, the governing body of Hakurei has decided that it can reduce the costs of armed peacekeeping through various efforts in sectors."
HAK_guarantees_for_all:0 "Guarantees for All"
HAK_guarantees_for_all_desc:0 "Our wish for unity and stability starts with removing the capabilities for warfare...\n\nIf we present collective response over aggression, we can deter forces that wish to destabilize Gensokyo."
HAK_reinforcement_of_tradition:0 "Reinforcement of Tradition"
HAK_reinforcement_of_tradition_desc:0 "We can continue our pursuit of international agreement upon peace effectively with the conclusion of the recent incident.\n\nMay Gensokyo continue to thrive."
HAK_resource_gathering_intiative:0 "Resource Gathering Intiative"
HAK_resource_gathering_intiative_desc:0 "Despite being one of the most organized nations in Gensokyo's, we have not extracted all the potential resources in our territory for improvement of living conditions."
HAK_war_with_the_yokai_mountain:0 "War with the Yokai Mountain"
HAK_war_with_the_yokai_mountain_desc:0 "The perpetrators of the Marketeering incident have established their center of command in the mountains of Yokai Mountain. Despite our greatest efforts, it seems we must escalate to physical, armed warfare to reach them now."
HAK_ban_international_avian_flight:0 "Ban International Avian Flight"
HAK_ban_international_avian_flight_desc:0 "Weakly disguised as news outlets, the government of Yokai Mountain has exploited the extreme reconnaissance skills of their aerial media handlers. We must ground all crows and related flight for now until the crisis clears."
HAK_denounce_the_capitalist_movement:0 "Denounce the Capitalist Movement"
HAK_denounce_the_capitalist_movement_desc:0 "We must make it known that the influence of new or outside ideologies will undermine the stability of our dimension. We must stop the flow with the discouragement of it."
HAK_ofuda_observation:0 "Ofuda Observation"
HAK_ofuda_observation_desc:0 "The properties surrounding the Ofuda are not fully understood, and it would be in our best interests to study and research it, both in the lab and in the field."
HAK_youkai_restraining_tactics:0 "Youkai Restraining Tactics"
HAK_youkai_restraining_tactics_desc:0 "For the purpose of subduing Youkai, we must have troops ready to pursue the inevitable, that is, adequate training to the new threats."
HAK_barrier_channeling:0 "Barrier Channeling"
HAK_barrier_channeling_desc:0 "The barrier that keeps our dimension separated form modern Earth is forged with the most powerful of energies possible. Being the guardians of such, we can figure out ways to utilize its power."
HAK_coastal_reinforcement_initiative:0 "Coastal Reinforcement Initiative"
HAK_coastal_reinforcement_initiative_desc:0 "We and our allies must ensure that coastal travel is not under full threat from naval powers. A project to improve this weakness is a must!"
HAK_flyingmaidensclub:0 "Flying Maiden's Club"
HAK_flyingmaidensclub_desc:0 "Our gifted shrine keepers that have achieved flight in their magical powers have been forced to low-aerial combat capabilities. Should we integrate them into more air force-related positions, we could see revolutionary breakthroughs in warfare performance."
HAK_youkai_penal_program:0 "Youkai Penal Program"
HAK_youkai_penal_program_desc:0 "The use of those incarcerated for military purposes brings a variety of outcomes, but greatly solves our lack of manpower."
HAK_free_the_guilty:0 "Free the Guilty"
HAK_free_the_guilty_desc:0 "It is in the interest to keep Gensokyo friendly. By reprimanding and releasing the perpetrators of the recent incident, may we begin to return to normalcy."
HAK_investment_in_land_wargames:0 "Investment in Land Wargames"
HAK_investment_in_land_wargames_desc:0 "We can improve the efficiency of our campaigns and deterrence of bad actors in Gensokyo by first bettering our Army's command and exercises."
HAK_unrestricted_intervention:0 "Unrestricted Intervention"
HAK_unrestricted_intervention_desc:0 "It is obvious that we cannot quell the masses or chaos using the enforcement we have throughout Gensokyo's history. It is time to further push our potential in restoring the dimension."
HAK_requestyukarisaid:0 "Request Yukari's Aid"
HAK_requestyukarisaid_desc:0 "Yukari Yakumo, magician and Youkai of border manipulation, was one of the main reasons Gensokyo existed.\n\nDespite her decades of hibernation, she must awaken once more."
HAK_the_status_quo:0 "The Status Quo"
HAK_the_status_quo_desc:0 "We have begun a return to normalcy. We may begin peacetime policy progression."
HAK_naval_tech_cooperation:0 "Naval Tech Cooperation"
HAK_naval_tech_cooperation_desc:0 "Collaboration with our coastal allies will ensure everyone we support are up to speed with technology in navy."
HAK_preparatory_defense:0 "Preparatory Defense"
HAK_preparatory_defense_desc:0 "The improvement of static defenses will prove useful for future altercations with incident-makers."
HAK_preparatorydefensecontinued:0 "Preparatory Defense (Continued)"
HAK_preparatorydefensecontinued_desc:0 "The capacity of defense has been expanded, but without a strong logistical consistency, it is good as none in the lengthiest of conflicts."
HAK_shockrescue_paratroopers:0 "Shock-Rescue Paratroopers"
HAK_shockrescue_paratroopers_desc:0 "We must have capabilities to reach locations that need our help quicker than land forces. Using specialized troops that utilize air transportation is a viable option."
HAK_expand_the_shrines:0 "Expand the Shrines"
HAK_expand_the_shrines_desc:0 "After centuries of existence, a lack of focus on the maintenance and state of our shrines has created a lackluster image of our beliefs.\n\nWe can fix that."
HAK_better_roads_for_gensokyo:0 "Better Roads for Gensokyo"
HAK_better_roads_for_gensokyo_desc:0 "We can undertake a massive project to improve the transportation speed in Gensokyo."
HAK_rural_infrastructure_support:0 "Rural Infrastructure Support"
HAK_rural_infrastructure_support_desc:0 "Our dominantly rural and mountainous terrain has its inconveniences, especially traversal. We can prioritize it and fix it."
HAK_expand_the_mics:0 "Expand the MICs"
HAK_expand_the_mics_desc:0 "We are behind in our military. It should be of our priority to utilize peacetime to expand it fast."
HAK_hakurei_institute_of_sciences:0 "Hakurei Institute of Sciences"
HAK_hakurei_institute_of_sciences_desc:0 "If we focus on leading the research in Gensokyo, we can be more successful in our governance."
HAK_frugality_for_stability:0 "Frugality for Stability"
HAK_frugality_for_stability_desc:0 "In an effort to bring surplus resources to Gensokyo, we can cut back on consumptions in various sectors."
