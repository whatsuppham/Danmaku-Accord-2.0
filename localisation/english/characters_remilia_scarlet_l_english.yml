 SCA_Remilia_Scarlet:0 "Remilia Scarlet"
 SCA_LEADER_REMILIA_SCARLET_DESCRIPTION:0 "Remilia Scarlet, believed to have been born in 1502 in the shadowed reaches of old Europe, rules the Scarlet Dominion as a paradox of refinement and instability, her origins shrouded in quiet mystery befitting an ancient vampiric bloodline. Unlike traditional vampires, she indulges selectively, favoring luxury and aesthetic over necessity, shaping a court culture centered on decadence rather than survival. Yet this restraint is offset by a childish and unpredictable temperament, where decisions may be driven as much by whim as by intent, keeping her subordinates in a constant state of uncertainty. Her reputation as a messy predator, spilling more blood than she consumes, further reinforces the Dominion’s image as both theatrical and dangerous. Under her rule, the state exists in a tension between elegance and excess, discipline and impulse, held together not by consistency, but by the overwhelming force of her presence."
